name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  BUILD_TAG: rtorrent-rutorrent:test
  CONTAINER_NAME: rtorrent-rutorrent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          targets: image-local
          set: |
            *.cache-from=type=gha,scope=build-linux-amd64
        env:
          DEFAULT_TAG: ${{ env.BUILD_TAG }}
      -
        name: Start
        run: |
          docker compose up -d
        working-directory: test
        env:
          RTORRENT_RUTORRENT_IMAGE: ${{ env.BUILD_TAG }}
          RTORRENT_RUTORRENT_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Check container logs
        uses: crazy-max/.github/.github/actions/container-logs-check@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "ready to handle connections"
          timeout: 120
      -
        # "ready to handle connections" comes from PHP-FPM, so it says nothing
        # about rTorrent. Assert the process is actually alive and its config
        # parsed, otherwise a rejected .rtlocal.rc/.rtorrent.rc passes CI.
        name: Check rTorrent config parsed
        run: |
          set -euo pipefail
          if docker logs ${{ env.CONTAINER_NAME }} 2>&1 | grep -qE 'input_error|invalid option name|Failed to parse'; then
            echo "::error::rTorrent rejected its configuration"
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1
          fi
          docker exec ${{ env.CONTAINER_NAME }} pgrep -f 'rtorrent -o import' >/dev/null \
            || { echo "::error::rtorrent process is not running"; docker logs ${{ env.CONTAINER_NAME }}; exit 1; }
      -
        name: Wait for healthcheck
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            state="$(docker inspect -f '{{.State.Health.Status}}' ${{ env.CONTAINER_NAME }} 2>/dev/null || echo starting)"
            if [ "$state" = "healthy" ]; then
              echo "healthy after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          docker logs ${{ env.CONTAINER_NAME }}
          echo "::error::container never reported healthy (last state: ${state})"
          exit 1
      -
        name: Check ruTorrent environment
        run: |
          docker exec ${{ env.CONTAINER_NAME }} rutorrent-env-check
      -
        name: Logs
        if: always()
        run: |
          docker compose logs
        working-directory: test
        env:
          RTORRENT_RUTORRENT_IMAGE: ${{ env.BUILD_TAG }}
          RTORRENT_RUTORRENT_CONTAINER: ${{ env.CONTAINER_NAME }}
